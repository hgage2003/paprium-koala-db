name: Update Paprium database

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate database
        run: python generate_db.py

      - name: Publish database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/db.json downloader_paprium_koala.ini
          if git diff --cached --quiet; then
            echo "Database is already current."
            exit 0
          fi
          git commit -m "Update the Paprium downloader database"
          git push
